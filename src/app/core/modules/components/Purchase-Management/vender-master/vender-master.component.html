<div class="page-container">

  <!-- PAGE TITLE -->
  <div class="page-title animate-left">
    <i class="bi bi-truck"></i>
    Vendor Master
  </div>

  <!-- FORM LEFT + LIST RIGHT -->
  <div class="form-list-layout">

    <!-- ================= FORM PANEL ================= -->
    <div class="form-panel animate-left">

      <div class="erp-card">

        <div class="erp-card-header primary">
          <span>
            <i class="bi bi-plus-circle"></i>
            {{ editMode ? 'Edit Vendor' : 'New Vendor' }}
          </span>

          <span *ngIf="editMode" class="erp-badge warning">
            Edit Mode
          </span>
        </div>

        <div class="erp-card-body">

          <form #vendorForm="ngForm" (ngSubmit)="onSubmit(vendorForm)">

            <div class="form-group">
              <label class="form-label">
                Vendor Name <span class="required">*</span>
              </label>

              <input type="text"
                     class="form-control"
                     name="name"
                     [(ngModel)]="vendor.name"
                     required
                     placeholder="e.g. Ali Traders">
            </div>

            <div class="form-group">
              <label class="form-label">
                Email <span class="required">*</span>
              </label>

              <input type="email"
                     class="form-control"
                     name="email"
                     [(ngModel)]="vendor.email"
                     required
                     placeholder="email@example.com">
            </div>

            <div class="form-group">
              <label class="form-label">
                Phone <span class="required">*</span>
              </label>

              <input type="text"
                     class="form-control"
                     name="phone"
                     [(ngModel)]="vendor.phone"
                     required
                     placeholder="0300-0000000">
            </div>

            <div class="form-group">
              <label class="form-label">City</label>

              <input type="text"
                     class="form-control"
                     name="city"
                     [(ngModel)]="vendor.city"
                     placeholder="Karachi">
            </div>

            <div class="form-group">
              <label class="form-label">Address</label>

              <textarea class="form-control"
                        name="address"
                        [(ngModel)]="vendor.address"
                        rows="3"
                        placeholder="Complete address..."></textarea>
            </div>

            <div class="form-actions">

              <button type="submit" class="btn btn-primary w-full">
                <i class="bi bi-check-lg"></i>
                {{ editMode ? 'Update Vendor' : 'Save Vendor' }}
              </button>

              <button type="button"
                      class="btn btn-light w-full"
                      (click)="resetForm()">

                <i class="bi bi-arrow-counterclockwise"></i>
                Reset

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

    <!-- ================= LIST PANEL ================= -->
    <div class="list-panel animate-right">

      <div class="erp-card">

        <div class="erp-card-header dark flex">

          <span>
            <i class="bi bi-list-ul"></i>
            Vendor List
          </span>

          <span class="erp-badge gray">
            {{ vendorList.length }} vendors
          </span>

        </div>

        <div class="erp-card-body p-0">

          <div class="erp-table-wrapper">

            <table class="erp-table">

              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>City</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>

              <tbody class="stagger">

                <tr *ngFor="let v of vendorList; let i = index">

                  <td class="text-muted fs-sm">{{ i + 1 }}</td>

                  <td class="fw-600">{{ v.name }}</td>

                  <td class="text-muted">{{ v.email }}</td>

                  <td>{{ v.phone }}</td>

                  <td>
                    <span *ngIf="v.city" class="erp-badge gray">
                      {{ v.city }}
                    </span>
                  </td>

                  <td class="text-center flex gap-2 justify-content-center">

                    <button class="btn btn-outline-primary btn-sm"
                            (click)="editVendor(v)">
                      <i class="bi bi-pencil"></i>
                    </button>

                    <button class="btn btn-outline-danger btn-sm"
                            (click)="deleteVendor(v.id!)">
                      <i class="bi bi-trash"></i>
                    </button>

                  </td>

                </tr>

              </tbody>

            </table>

            <!-- EMPTY STATE -->
            <div *ngIf="vendorList.length === 0" class="empty-state">

              <i class="bi bi-truck"></i>
              <p>No vendors found — add from left panel</p>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
