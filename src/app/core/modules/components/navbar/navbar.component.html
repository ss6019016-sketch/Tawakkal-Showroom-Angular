<header class="app-header">
  <!-- Top Blue Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <button class="menu-toggle" (click)="toggleSidebar()" title="Toggle Menu">
        ☰ MAIN MENU
      </button>
    </div>
    
    <div class="top-bar-center">
      <h1 class="company-name">TAWAKKAL SHOWROOM</h1>
    </div>
    
    <div class="top-bar-right">
      <span class="connection-status">Connected as : <strong>{{ userFullName || 'Sultan' }}</strong></span>
      <button class="btn-signout" (click)="logout()" title="Sign Out">
        Sign Out :
      </button>
    </div>
  </div>

  <!-- Secondary Header Bar -->
  <div class="secondary-bar">
    <!-- Left: Logo -->
    <div class="secondary-left">
      <!-- <img class="logo" src="https://invoicex.theme29.com/storage/logo/697d99eb6c1fe.png" alt="Logo"> -->
    </div>

    <!-- Center: Quick Actions (Desktop) -->
    <div class="secondary-center d-none d-lg-flex">
      <!-- Add quick action buttons here if needed -->
    </div>

    <!-- Right: Action Buttons & User -->
    <div class="secondary-right">

         <button class="action-btn" routerLink="/product-master" title="Product Master">
       <i class="bi bi-cart"></i>
        <span>Product Master</span>
      </button>
      <!-- Action Buttons -->
      <button class="action-btn" routerLink="/sales-invoice" title="Sales Invoice">
        <i class="bi bi-file-earmark-text"></i>
        <span>Sales Invoice</span>
      </button>

      <button class="action-btn" title="Tawakkal Stamp">
        <i class="bi bi-patch-check"></i>
        <span>Tawakkal Stamp</span>
      </button>

      <!-- Notifications -->
      <button class="icon-btn" (click)="openNotifications()" title="Notifications">
        <i class="bi bi-bell"></i>
        <span class="badge-count" *ngIf="hasNotifications">{{ getNotificationDisplay() }}</span>
      </button>

      <!-- Fullscreen -->
      <button class="icon-btn" (click)="toggleFullscreen()" title="Fullscreen">
        <i class="bi" [ngClass]="isFullscreen ? 'bi-fullscreen-exit' : 'bi-arrows-fullscreen'"></i>
      </button>

      <!-- Language Dropdown -->
      <!-- <div class="dropdown">
        <button class="icon-btn dropdown-toggle" data-bs-toggle="dropdown">
          🌐 {{ currentLanguage }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="changeLanguage('EN')">
              <span class="me-2">🇬🇧</span> English
            </a>
          </li>
          <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="changeLanguage('UR')">
              <span class="me-2">🇵🇰</span> اردو
            </a>
          </li>
          <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="changeLanguage('AR')">
              <span class="me-2">🇸🇦</span> عربي
            </a>
          </li>
        </ul>
      </div> -->

      <!-- User Dropdown -->
      <div class="dropdown">
        <button class="user-btn" data-bs-toggle="dropdown">
          <div class="user-avatar">
            <div *ngIf="userProfilePicture && !isLoading; else showInitials">
              <img [src]="getProfilePictureUrl()" alt="Profile">
            </div>
            <ng-template #showInitials>
              <span>{{ userInitials }}</span>
            </ng-template>
          </div>
          <div class="user-info d-none d-md-block">
            <span class="user-name">{{ userFullName }}</span>
            <span class="user-role">{{ userRole }}</span>
          </div>
          <i class="bi bi-chevron-down"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end user-dropdown">
          <li class="dropdown-header">
            <div class="user-dropdown-header">
              <div class="user-avatar-large">
                <div *ngIf="userProfilePicture && !isLoading; else showLargeInitials">
                  <img [src]="getProfilePictureUrl()" alt="Profile">
                </div>
                <ng-template #showLargeInitials>
                  <span>{{ userInitials }}</span>
                </ng-template>
              </div>
              <div class="user-info-dropdown">
                <strong>{{ userFullName }}</strong>
                <small>{{ userEmail }}</small>
                <span class="badge mt-1" [ngClass]="getRoleBadgeClass()">{{ userRole }}</span>
              </div>
            </div>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="navigateToProfile()">
              <i class="bi bi-person"></i> My Profile
            </a>
          </li>
           <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="navigateToProfile()">
              <i class="bi bi-person"></i> Change Password
            </a>
          </li>
          <li>
            <a class="dropdown-item" href="javascript:void(0)" (click)="navigateToSettings()">
              <i class="bi bi-gear"></i> Settings
            </a>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item text-danger" href="javascript:void(0)" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
