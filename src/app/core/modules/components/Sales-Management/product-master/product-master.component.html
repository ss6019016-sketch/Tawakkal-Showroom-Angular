<div class="container mt-4">
  <h2 class="mb-4 fw-bold text-primary text-center">
    <i class="bi bi-box-seam me-2"></i>Product Master
  </h2>

  <div class="card shadow mb-4">
    <div class="card-header bg-primary text-white">Add / Edit Product</div>
    <div class="card-body">
      <form #productForm="ngForm" (ngSubmit)="onSubmit(productForm)">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Product Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="name"
                   [(ngModel)]="product.name" required placeholder="Product name">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Rate <span class="text-danger">*</span></label>
            <input type="number" class="form-control" name="rate"
                   [(ngModel)]="product.rate" required min="0" placeholder="0.00">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Unit</label>
            <input type="text" class="form-control" name="unit"
                   [(ngModel)]="product.unit" placeholder="e.g. Pcs, Kg, Box">
          </div>
          <div class="col-md-12 mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description"
                      [(ngModel)]="product.description" rows="2"></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary me-2">
          <i class="bi bi-check-lg me-1"></i>{{ editMode ? 'Update' : 'Save' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="reset()">Reset</button>
      </form>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-header bg-dark text-white">Product List</div>
    <div class="card-body table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>#</th><th>Name</th><th>Rate</th><th>Unit</th><th>Description</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of productList; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ p.name }}</td>
            <td class="text-end">{{ p.rate | number:'1.2-2' }}</td>
            <td>{{ p.unit }}</td>
            <td>{{ p.description }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-1" (click)="edit(p)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-danger" (click)="delete(p.id!)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="productList.length === 0">
            <td colspan="6" class="text-center text-muted">Koi product nahi</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
