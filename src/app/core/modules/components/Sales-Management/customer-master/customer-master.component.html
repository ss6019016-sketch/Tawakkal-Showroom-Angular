<div class="page-container animate-left">

  <!-- TITLE -->
  <div class="page-title text-success">
    <i class="bi bi-people"></i>
    Customer Master
  </div>

  <!-- FORM + LIST -->
  <div class="form-list-layout">

    <!-- ================= FORM ================= -->

    <div class="form-panel erp-card animate-left">

      <div class="erp-card-header success text-white">
        Add / Edit Customer
      </div>

      <div class="erp-card-body">

        <form #customerForm="ngForm"
              (ngSubmit)="onSubmit(customerForm)">

          <div class="row">

            <!-- FIRST NAME -->

            <div class="col-md-6 mb-3">

              <label>First Name *</label>

              <input type="text"
                     class="form-control"
                     [(ngModel)]="customer.firstName"
                     name="firstName"
                     required
                     placeholder="First Name">

            </div>

            <!-- LAST NAME -->

            <div class="col-md-6 mb-3">

              <label>Last Name *</label>

              <input type="text"
                     class="form-control"
                     [(ngModel)]="customer.lastName"
                     name="lastName"
                     required
                     placeholder="Last Name">

            </div>

            <!-- EMAIL -->

            <div class="col-md-6 mb-3">

              <label>Email *</label>

              <input type="email"
                     class="form-control"
                     [(ngModel)]="customer.email"
                     name="email"
                     required
                     placeholder="Email">

            </div>

            <!-- PHONE -->

            <div class="col-md-6 mb-3">

              <label>Phone</label>

              <input type="text"
                     class="form-control"
                     [(ngModel)]="customer.phone"
                     name="phone"
                     placeholder="Phone">

            </div>

            <!-- ADDRESS -->

            <div class="col-12 mb-3">

              <label>Address</label>

              <textarea class="form-control"
                        [(ngModel)]="customer.address"
                        name="address"
                        rows="2">
              </textarea>

            </div>

          </div>

          <!-- BUTTONS -->

          <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-success">

              <i class="bi bi-check-lg"></i>

              {{ editMode ? 'Update' : 'Save' }}

            </button>

            <button type="button"
                    class="btn btn-light"
                    (click)="reset()">

              Reset

            </button>

          </div>

        </form>

      </div>

    </div>

    <!-- ================= LIST ================= -->

    <div class="list-panel erp-card animate-right">

      <div class="erp-card-header dark text-white">
        Customer List
      </div>

      <div class="erp-card-body table-responsive">

        <table class="erp-table">

          <thead>

            <tr>
              <th>#</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let c of paginatedCustomers; let i = index">

              <td>{{ i + 1 }}</td>

              <td class="fw-semibold">
                {{ c.fullName }}
              </td>

              <td>{{ c.email }}</td>

              <td>{{ c.phone }}</td>

              <td>{{ c.address }}</td>

              <td>

                <button class="btn btn-sm btn-outline-primary me-1"
                        (click)="edit(c)">

                  <i class="bi bi-pencil"></i>

                </button>

                <button class="btn btn-sm btn-outline-danger"
                        (click)="delete(c.customerId!)">

                  <i class="bi bi-trash"></i>

                </button>

              </td>

            </tr>

            <tr *ngIf="customerList.length === 0">

              <td colspan="6"
                  class="empty-state">

                Koi customer nahi

              </td>

            </tr>

          </tbody>

        </table>

      </div>

      <!-- PAGINATION -->

      <app-pagination
        [data]="customerList"
        [pageSize]="5"
        (pagedData)="onPageChange($event)">
      </app-pagination>

    </div>

  </div>

</div>
