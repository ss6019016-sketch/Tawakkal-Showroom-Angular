<div class="page-container animate-left">

  <!-- PAGE TITLE -->
  <div class="page-title text-success mb-4">
    <i nz-icon nzType="team" nzTheme="outline"></i>
    Customer Master
  </div>

  <!-- FORM + LIST -->
  <div nz-row [nzGutter]="16">

    <!-- ================= FORM ================= -->

    <div nz-col nzXs="24" nzLg="8">

      <nz-card
        class="erp-card animate-left"
        [nzTitle]="formTitle">

        <ng-template #formTitle>
          <div class="d-flex align-items-center gap-2">
            <i nz-icon nzType="form" nzTheme="outline"></i>
            <span>Add / Edit Customer</span>
          </div>
        </ng-template>

        <form
          #customerForm="ngForm"
          nz-form
          nzLayout="vertical"
          (ngSubmit)="onSubmit(customerForm)">

          <div nz-row [nzGutter]="12">

            <!-- FIRST NAME -->
            <div nz-col nzXs="24" nzMd="12">

              <nz-form-item>
                <nz-form-label nzRequired>
                  First Name
                </nz-form-label>

                <nz-form-control>

                  <input
                    nz-input
                    type="text"
                    [(ngModel)]="customer.firstName"
                    name="firstName"
                    required
                    placeholder="First Name">

                </nz-form-control>

              </nz-form-item>

            </div>

            <!-- LAST NAME -->
            <div nz-col nzXs="24" nzMd="12">

              <nz-form-item>

                <nz-form-label nzRequired>
                  Last Name
                </nz-form-label>

                <nz-form-control>

                  <input
                    nz-input
                    type="text"
                    [(ngModel)]="customer.lastName"
                    name="lastName"
                    required
                    placeholder="Last Name">

                </nz-form-control>

              </nz-form-item>

            </div>

            <!-- EMAIL -->
            <div nz-col nzXs="24" nzMd="12">

              <nz-form-item>

                <nz-form-label nzRequired>
                  Email
                </nz-form-label>

                <nz-form-control>

                  <input
                    nz-input
                    type="email"
                    [(ngModel)]="customer.email"
                    name="email"
                    required
                    placeholder="Email">

                </nz-form-control>

              </nz-form-item>

            </div>

            <!-- PHONE -->
            <div nz-col nzXs="24" nzMd="12">

              <nz-form-item>

                <nz-form-label>
                  Phone
                </nz-form-label>

                <nz-form-control>

                  <input
                    nz-input
                    type="text"
                    [(ngModel)]="customer.phone"
                    name="phone"
                    placeholder="Phone">

                </nz-form-control>

              </nz-form-item>

            </div>

            <!-- ADDRESS -->
            <div nz-col nzSpan="24">

              <nz-form-item>

                <nz-form-label>
                  Address
                </nz-form-label>

                <nz-form-control>

                  <textarea
                    nz-input
                    rows="3"
                    [(ngModel)]="customer.address"
                    name="address"
                    placeholder="Address">
                  </textarea>

                </nz-form-control>

              </nz-form-item>

            </div>

          </div>

          <!-- BUTTONS -->

          <div class="d-flex gap-2 mt-3">

            <button
              nz-button
              nzType="primary"
              [nzLoading]="loading">

              <i nz-icon nzType="save" nzTheme="outline"></i>

              {{ editMode ? 'Update' : 'Save' }}

            </button>

            <button
              nz-button
              nzType="default"
              type="button"
              (click)="reset()">

              <i nz-icon nzType="reload" nzTheme="outline"></i>
              Reset

            </button>

          </div>

        </form>

      </nz-card>

    </div>

    <!-- ================= LIST ================= -->

    <div nz-col nzXs="24" nzLg="16">

      <nz-card
        class="erp-card animate-right"
        [nzTitle]="listTitle">

        <ng-template #listTitle>
          <div class="d-flex align-items-center gap-2">
            <i nz-icon nzType="unordered-list" nzTheme="outline"></i>
            <span>Customer List</span>
          </div>
        </ng-template>

        <!-- TABLE -->

        <nz-table
          #customerTable
          [nzData]="paginatedCustomers"
          [nzFrontPagination]="false"
          [nzScroll]="{ x: '1000px' }"
          nzBordered
          nzSize="middle">

          <thead>

            <tr>

              <th>#</th>

              <th>Full Name</th>

              <th>Email</th>

              <th>Phone</th>

              <th>Address</th>

              <th width="120px">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let c of customerTable.data; let i = index">

              <td>
                {{ i + 1 }}
              </td>

              <td class="fw-semibold">

                <nz-tag nzColor="blue">
                  {{ c.fullName }}
                </nz-tag>

              </td>

              <td>{{ c.email }}</td>

              <td>{{ c.phone }}</td>

              <td>{{ c.address }}</td>

              <td>

                <div class="d-flex gap-1">

                  <!-- EDIT -->

                  <button
                    nz-button
                    nzType="primary"
                    nzSize="small"
                    nz-tooltip
                    nzTooltipTitle="Edit"
                    (click)="edit(c)">

                    <i nz-icon nzType="edit" nzTheme="outline"></i>

                  </button>

                  <!-- DELETE -->

                  <button
                    nz-button
                    nzDanger
                    nzSize="small"
                    nz-tooltip
                    nzTooltipTitle="Delete"
                    (click)="delete(c.customerId!)">

                    <i nz-icon nzType="delete" nzTheme="outline"></i>

                  </button>

                </div>

              </td>

            </tr>

            <!-- EMPTY -->

            <tr *ngIf="customerList.length === 0">

              <td colspan="6">

                <nz-empty
                  nzNotFoundContent="Koi customer nahi">
                </nz-empty>

              </td>

            </tr>

          </tbody>

        </nz-table>

        <!-- PAGINATION -->

        <div class="mt-3 d-flex justify-content-end">

          <app-pagination
            [data]="customerList"
            [pageSize]="5"
            (pagedData)="onPageChange($event)">
          </app-pagination>

        </div>

      </nz-card>

    </div>

  </div>

</div>
