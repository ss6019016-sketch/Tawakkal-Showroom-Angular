<div class="page-container">

  <!-- PAGE TITLE -->
  <div class="page-title animate-left">
    <i class="bi bi-shield-check"></i>
    System Roles
  </div>

  <div class="page-subtitle">
    System ke default roles aur permissions structure
  </div>

  <!-- INFO ALERT -->
  <div class="erp-alert info animate-fade">

    <i class="bi bi-info-circle"></i>

    <div>
   These are the system's default roles. In the future, they can be linked with users.
    </div>

  </div>

  <!-- ROLES CARD -->
  <div class="erp-card animate-scale">

    <div class="erp-card-header dark">
      Available Roles
    </div>

    <div class="erp-card-body">

      <div class="row stagger">

        <div class="col-md-6" *ngFor="let role of roles">

          <!-- ROLE CARD -->
          <div class="stat-card">

            <div class="stat-icon"
                 [ngClass]="role.color">

              <i class="bi bi-shield-lock"></i>

            </div>

            <div>

              <div class="fw-700 fs-base">

                <span class="erp-badge"
                      [ngClass]="role.color">

                  {{ role.name }}

                </span>

              </div>

              <div class="stat-label mt-2">
                {{ role.description }}
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
