<nz-sider
  nzTheme="light"
  nzCollapsible
  [(nzCollapsed)]="isCollapsed"
  [nzTrigger]="null"
  style="max-width: 280px; width: 280px">

  <!-- LOGO -->
  <div class="logo-container shadow-lg" *ngIf="!isLoading">
    <img src="assets/images/asia.jfif" alt="Logo" style="display: block; margin: 0 auto" />
  </div>

  <!-- MENU -->
  <ul nz-menu nzMode="inline" class="sider-menu">

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-container">
      <div class="container">
        <nz-spin nzSimple></nz-spin>
      </div>
    </div>
    <nz-skeleton
      *ngIf="isLoading"
      [nzActive]="true"
      [nzParagraph]="{ rows: 12 }"
      class="p-2">
    </nz-skeleton>

    <!-- Loaded menu items -->
    <ng-container *ngIf="!isLoading">
      <ng-container *ngFor="let item of menuItems">

        <!-- Parent with children (submenu) -->
        <li
          nz-submenu
          *ngIf="item.children && item.children.length"
          [nzTitle]="item.label"
          [nzIcon]="item.icon"
          [nzOpen]="item.expanded"
          (nzOpenChange)="item.expanded = $event">

          <ul>
            <li
              nz-menu-item
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              [ngClass]="{ active: isActive(child.route || '') }"
              nz-tooltip
              [nzTooltipTitle]="child.label"
              nzTooltipPlacement="right">
              <i nz-icon [nzType]="child.icon"></i>
              <span>{{ child.label }}</span>
            </li>
          </ul>

        </li>

        <!-- Parent without children (direct link) -->
        <li
          nz-menu-item
          *ngIf="!item.children || !item.children.length"
          [routerLink]="item.route"
          [ngClass]="{ active: isActive(item.route || '') }"
          nz-tooltip
          [nzTooltipTitle]="item.label"
          nzTooltipPlacement="right">
          <i nz-icon [nzType]="item.icon"></i>
          <span>{{ item.label }}</span>
        </li>

      </ng-container>
    </ng-container>

  </ul>
</nz-sider>
