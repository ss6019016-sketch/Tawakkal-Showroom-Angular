    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5">
      <div style="background:#fff;padding:36px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);width:100%;max-width:380px">
 
        <h2 style="text-align:center;margin:0 0 24px;font-size:20px;color:#1a1a2e">Login</h2>
 
        <!-- Error -->
        <div *ngIf="error"
          style="background:#fff0f0;border:1px solid #ffcdd2;border-radius:8px;color:#c62828;font-size:13px;padding:10px 14px;margin-bottom:16px">
          {{ error }}
        </div>
 
        <!-- ═══ Step 1: Email + Password ═══ -->
        <ng-container *ngIf="step === 'credentials'">
 
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:500;color:#444;margin-bottom:6px">Email</label>
            <input [(ngModel)]="email" type="email" placeholder="email@example.com"
              style="width:100%;padding:10px 12px;border:1px solid #dde1e7;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none"/>
          </div>
 
          <div style="margin-bottom:20px">
            <label style="display:block;font-size:13px;font-weight:500;color:#444;margin-bottom:6px">Password</label>
            <input [(ngModel)]="password" type="password" placeholder="••••••••"
              style="width:100%;padding:10px 12px;border:1px solid #dde1e7;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none"/>
          </div>
 
          <button (click)="onGetTenants()" [disabled]="isLoading"
            style="width:100%;padding:11px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;opacity:1"
            [style.opacity]="isLoading ? '0.6' : '1'">
            {{ isLoading ? 'Loading...' : 'Aage Barhein' }}
          </button>
 
        </ng-container>
 
        <!-- ═══ Step 2: Tenant select ═══ -->
        <ng-container *ngIf="step === 'tenant'">
 
          <p style="font-size:13px;color:#666;text-align:center;margin:0 0 14px">Apni branch select karein</p>
 
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">
            <label *ngFor="let t of tenants"
              [style.border]="selectedTenantId === t.tenantId ? '1.5px solid #4a6cf7' : '1.5px solid #dde1e7'"
              [style.background]="selectedTenantId === t.tenantId ? '#eef1ff' : '#fff'"
              style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;cursor:pointer;transition:all 0.15s">
              <input type="radio" [value]="t.tenantId" [(ngModel)]="selectedTenantId"/>
              <div>
                <div style="font-size:14px;font-weight:500;color:#1a1a2e">{{ t.name }}</div>
                <div style="font-size:12px;color:#888;margin-top:2px">{{ t.domain }}</div>
              </div>
            </label>
          </div>
 
          <button (click)="onLogin()" [disabled]="isLoading"
            style="width:100%;padding:11px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer"
            [style.opacity]="isLoading ? '0.6' : '1'">
            {{ isLoading ? 'Logging in...' : 'Login' }}
          </button>
 
          <button (click)="step = 'credentials'; error = ''"
            style="width:100%;padding:10px;background:transparent;color:#666;border:1px solid #dde1e7;border-radius:8px;font-size:13px;cursor:pointer;margin-top:10px">
            ← Wapas
          </button>
 
        </ng-container>
 
      </div>
    </div>
